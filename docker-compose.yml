services:
  phishguard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      SANDBOX_API_URL: http://sandbox:4001
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:?set SANDBOX_API_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      sandbox:
        condition: service_healthy
    networks:
      - phishguard_internal

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:?set SANDBOX_API_TOKEN}
      SANDBOX_MAX_REQUESTS: 200
      SANDBOX_MAX_REDIRECTS: 8
      SANDBOX_NAVIGATION_TIMEOUT_MS: 15000
      SANDBOX_OVERALL_TIMEOUT_MS: 30000
      SANDBOX_MAX_DOWNLOAD_BYTES: 5242880
      SANDBOX_ARTIFACT_RETENTION_MS: 600000
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/pwuser:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - phishguard_internal
      - sandbox_egress

networks:
  phishguard_internal:
    internal: true
  sandbox_egress: {}
